name: Publier le site
# Relance la publication GitHub Pages (source : branche main, dossier racine)
# à chaque envoi sur main, y compris ceux faits par Claude.
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - name: Demander une nouvelle publication
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds"
